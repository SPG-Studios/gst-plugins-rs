[package]
name = "gst-plugin-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["David Maseda <david.masedan@gmail.com>"]
repository.workspace = true
description = "GStreamer filter element to run WebAssembly modules"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.100"
once_cell = "1.21.3"
wasmtime = "37.0.2"
gst.workspace = true
gst-base.workspace = true
gst-video = { workspace = true, features = ["v1_26"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"


[lib]
name = "gstwasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[dev-dependencies]
pretty_assertions = "1"
gst-check.workspace = true
gst-app.workspace = true
tempfile = "3.23.0"
sha2 = "0.10.9"

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
