[package]
name = "gst-plugin-xdgscreencapsrc"
version = "0.12.0-alpha.1"
authors = ["Ruben Gonzalez <rgonzalez@fluendo.com"]
license = "MPL-2.0"
description = "GStreamer xdg-desktop-portal screen capture plugin"
repository = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs"
edition = "2021"
rust-version = "1.70"

[dependencies]
gst.workspace = true
gst-video.workspace = true
gst-allocators.workspace = true
parking_lot = "0.12"
ashpd = {version = "0.9", default-features = false, features = ["tokio"]}
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
once_cell.workspace = true

[dev-dependencies]
either = "1.0"
gst-check.workspace = true

[lib]
name = "gstxdgscreencapsrc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
static = []
capi = []
doc = ["gst/v1_18"]
v1_24 = ["gst/v1_24", "gst-video/v1_24"]


[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-audio-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
