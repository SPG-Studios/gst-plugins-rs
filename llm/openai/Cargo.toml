[package]
name = "gst-plugin-llm"
version.workspace = true
authors = ["Manish <manish@heymanish.com>"]
repository.workspace = true
license = "MPL-2.0"
description = "GStreamer LLM plugin"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gst = { workspace = true, features = ["v1_20"] }
gst-audio = { workspace = true, features = ["v1_20"] }
gst-app = { workspace = true, features = ["v1_20"] }
gst-base.workspace = true
anyhow = "1.0.71"
bytes = "1.4.0"
tokio = { version = "1.28.2", features = ["sync", "rt-multi-thread"] }
tracing = "0.1.37"
thiserror = "1.0.40"
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
parking_lot = "0.11.2"
url = "2.3.1"
http = "1.0.0"
tokio-stream = "0.1.17"
async-tungstenite = { version = "0.29.1", features = [
    "tokio-runtime",
    "async-tls",
] }
futures = "0.3.24"

[lib]
name = "gstopenai"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true
