[package]
name = "gst-plugin-overlays"
version.workspace = true
authors = ["Jeremy Whiting <jeremy.whiting@collabora.com>"]
repository.workspace = true
license = "MPL-2.0"
description = "GStreamer Rust Overlay Elements Plugin"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "gstoverlays"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
gst.workspace = true
gst-base.workspace = true
gst-video.workspace = true
gst-analytics = { workspace = true, features = ["v1_30"] }
glib.workspace = true
skia = { package = "skia-safe", version = "0.97" }

[build-dependencies]
gst-plugin-version-helper.workspace = true

[dev-dependencies]
gst-app.workspace = true
gst-check.workspace = true

[features]
static = []
capi = []
doc = []

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
