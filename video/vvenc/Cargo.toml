[package]
name = "gst-plugin-vvenc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Carlos Bentzen <cadubentzen@igalia.com>"]
repository.workspace = true
license = "MPL-2.0"
description = "GStreamer VVenC VVC/H.266 encoder plugin"

[dependencies]
gst.workspace = true
gst-audio.workspace = true
gst-video = { workspace = true, features = ["v1_26"] }
vvenc = "0.1"
atomic_refcell = "0.1"
bytemuck = "1.23.0"

[dev-dependencies]
gst-check.workspace = true

[lib]
name = "gstvvenc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
capi = []

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0, libvvenc >= 1.13"
