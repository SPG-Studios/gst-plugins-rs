[package]
name = "gst-plugin-videorate2"
version.workspace = true
authors = ["Jochen Henneberg <jh@henneberg-systemdesign.com>"]
repository.workspace = true
license = "MPL-2.0"
edition.workspace = true
rust-version.workspace = true
description = "GStreamer plugin replacement for videorate"

[dependencies]
gst.workspace = true
gst-video.workspace = true

[dev-dependencies]
gst-check.workspace = true

[lib]
name = "gstvideorate2"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
static = []
capi = []
doc = ["gst/v1_18"]

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-video-1.0, gstreamer-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
