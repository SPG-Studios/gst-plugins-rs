[package]
name = "gst-plugin-dsc"
version = "0.1.0"
authors = ["Diego Nieto <dnieto@fluendo.com>"]
edition = "2021"
description = "GStreamer Digital Signed Content plugin"
repository = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs"
license = "MPL-2.0"

[dependencies]
hound = "3"
anyhow = "1"
glib.workspace = true
gst = { workspace = true, features = ["v1_20"] }
gst-base = { workspace = true, features = ["v1_20"] }
gst-video = { workspace = true, features = ["v1_30"] }
human_bytes = { version = "0.4", default-features = false }
atomic_refcell = "0.1"

rsa = { version = "0.9", features = ["pem"] }
rand = "0.9.2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
base64ct = "1.7.0"
once_cell = "1"
hex = "0.4"
smallvec = "1.13"
url = "2"
rustls-pemfile = "2"
x509-parser = { version = "0.16", features = ["verify"] }

[lib]
name = "gstdsc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = {  git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs" }

[features]
capi = []
static = []
doc = ["gst/v1_16"]

[dev-dependencies]
gst-check = { workspace = true, features = ["v1_20"] }
rcgen = "0.14"